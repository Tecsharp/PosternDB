# SonarQube / SonarCloud configuration for PosternDB.
# Run locally: see README section "SonarQube".
sonar.projectKey=posterndb
sonar.projectName=PosternDB
sonar.sourceEncoding=UTF-8

sonar.sources=cmd,internal,web/src
sonar.tests=internal
sonar.test.inclusions=**/*_test.go,web/src/**/*.test.ts,web/src/**/*.test.tsx

# main.go only wires dependencies; generated/built assets and SQL migrations
# are not production logic.
sonar.exclusions=**/node_modules/**,web/dist/**,**/*.sql
sonar.coverage.exclusions=cmd/posterndb/main.go,web/**,**/testsupport/**

# Coverage produced by:
#   go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./...
sonar.go.coverage.reportPaths=coverage.out
sonar.go.tests.reportPaths=test-report.json
